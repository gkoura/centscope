<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta
            name="viewport"
            content="width=device-width, initial-scale=1, viewport-fit=cover"
        />
        <meta
            name="theme-color"
            content="#fafbf8"
            media="(prefers-color-scheme: light)"
        />
        <meta
            name="theme-color"
            content="#141c18"
            media="(prefers-color-scheme: dark)"
        />
        <meta name="color-scheme" content="light dark" />
        <title>You’re offline | CentScope</title>
        <style>
            :root {
                font-family: system-ui, sans-serif;
                color: #222c27;
                background: #fafbf8;
            }
            body {
                margin: 0;
                min-height: 100svh;
                display: grid;
                place-items: center;
            }
            main {
                max-width: 28rem;
                padding: max(24px, env(safe-area-inset-top))
                    max(24px, env(safe-area-inset-right))
                    max(24px, env(safe-area-inset-bottom))
                    max(24px, env(safe-area-inset-left));
            }
            img {
                border-radius: 16px;
            }
            h1 {
                font-size: 2rem;
                letter-spacing: -0.04em;
            }
            p {
                line-height: 1.6;
            }
            button {
                margin-top: 12px;
                min-height: 44px;
                padding: 12px 20px;
                border: 0;
                border-radius: 10px;
                background: #286044;
                color: white;
                font: inherit;
                cursor: pointer;
                touch-action: manipulation;
            }
            button:focus-visible {
                outline: 3px solid #588566;
                outline-offset: 4px;
            }
            @media (prefers-color-scheme: dark) {
                :root {
                    color: #e9eee7;
                    background: #141c18;
                }
                button {
                    background: #a7cfa8;
                    color: #182b1d;
                }
            }
        </style>
    </head>
    <body>
        <main>
            <img
                src="/icons/icon-192.png"
                width="64"
                height="64"
                alt="CentScope"
            />
            <h1>You’re offline</h1>
            <p>
                Connect to the internet to open your workspace and save changes.
            </p>
            <p>
                If CentScope is still open in another tab, you may be able to
                view data already loaded there.
            </p>
            <button type="button" onclick="window.location.reload()">
                Try again
            </button>
        </main>
    </body>
</html>
